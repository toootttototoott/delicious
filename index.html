<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Admin</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var root = document.documentElement;
        if (path === "/widget") {
          root.classList.add("route-widget");
        }
        if (path === "/login" || path === "/") {
          root.classList.add("route-login");
        }
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c86a3c'/%3E%3Cpath d='M18 22h28v24H18z' fill='%23fff7ee'/%3E%3Cpath d='M22 16h4v10h-4zm16 0h4v10h-4zM22 30h20v4H22zm0 8h14v4H22z' fill='%238e4525'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead is-hidden">
        <div class="brand-block">
          <p class="eyebrow">Booking Admin</p>
          <h1>Operations Console</h1>
          <p class="meta">Users, locations, seat calendars, widget setup, and theme editing.</p>
        </div>
        <nav class="topnav">
          <a href="/login" data-link>Display</a>
          <a href="/settings" data-link>Settings</a>
        </nav>
      </header>
      <main id="app"></main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
