<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      :root {
        color: #1d1f24;
        background: #f4f7fb;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(92vw, 720px);
        padding: 48px;
        border: 1px solid #d8d3c8;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 20px 60px rgb(29 31 36 / 10%);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 9vw, 7rem);
        line-height: 0.95;
      }

      p {
        margin: 20px 0 0;
        color: #62666f;
        font-size: 1.125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello world.</h1>
      <p>A single page ready for Vercel.</p>
    </main>
  </body>
</html>
